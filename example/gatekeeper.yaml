
objects:
  - name: User
    package: example
    path: ./example/
    emit_interface_to:
      - package: other
        path: other
      - package: src
        path: .
    fields:
      - name: FirstName
        kind: string
        kindErr: "FirstName must be a string"
        validators:
          - name: minLen
            value: 3
            error: "FirstName must be >= 3 characters"
          - name: maxLen
            value: 10
            error: "FirstName must be <= 10 characters"
          - name: regex
            value: p([a-z]+)ch
            error: "FirstName must match regex p([a-z]+)ch"

      - name: LastName
        kind: string
        formName: "last name"
        kindErr: "last name must be a string"
        validators:
          - name: minLen
            value: 3
            error: "last name must be >= 3 characters. Got %v"
          - name: maxLen
            value: 10
            error: "last name must be <= 10 characters"

      - name: Email
        kind: string
        validators:
          - name: email
            error: "Email must a a valid email"

      - name: Id
        kind: uuid.UUID
        kindErr: "UserId must be a valid UUID"

      - name: CreatedAt
        kind: time.Time/time.DateTime
        kindErr: "CreatedAt must be a valid time"

      - name: PhoneNumber
        kind: libphonenumber.PhoneNumber/US
        kindErr: "PhoneNumber must be a valid phone number"
    


      - name: Age
        formName: age
        kind: int
        validators:
          - name: min
            value: 18
            error: "Age must be greater than 18"
          - name: max
            value: 100
            error: "Age must be less than 100"

  
 
      - name: BirthMonth
        kind: string
        formName: birth month
        validators:
          - name: option
            error: "birth month must be a valid month"
            value:
              - January
              - February
              - March
              - April
              - May
              - June
              - July
              - August
              - September
              - October
              - November
              - December


  - name: Search
    package: example
    path: example
    fields:
      - name: QueryString
        kind: string
        validators:
          - name: minLen
            value: 1
          - name: maxLen
            value: 24
      - name: ResultCount
        kind: int

